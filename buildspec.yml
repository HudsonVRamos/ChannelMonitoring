version: 0.2

env:
  parameter-store:
    POC_CHANNEL_URL: "/widevine-poc/channel-url"
    POC_LOG_LEVEL: "/widevine-poc/log-level"
  variables:
    POC_OUTPUT_DIR: "./output"
    POC_STORAGE_STATE_PATH: "storage_state/state.json"
    POC_DRM_TIMEOUT: "60"
    POC_TELEMETRY_DURATION: "10"
    POC_PLAYBACK_TIMEOUT: "60"
    ARTIFACTS_BUCKET: "widevine-poc-artifacts-us-east-1-761018874615"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "=== Instalando Google Chrome (com Widevine CDM) ==="
      - wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
      - dpkg -i google-chrome-stable_current_amd64.deb || apt-get -fy install
      - rm google-chrome-stable_current_amd64.deb
      - google-chrome --version
      - echo "=== Instalando Xvfb (display virtual) ==="
      - apt-get update -qq && apt-get install -y -qq xvfb
      - echo "=== Instalando dependências Python ==="
      - pip install --quiet -r requirements.txt
      - echo "=== Instalando Playwright (sem browsers — usaremos Chrome do sistema) ==="
      - pip install --quiet playwright
      - echo "=== Install completo ==="

  pre_build:
    commands:
      - echo "=== Baixando storageState do S3 ==="
      - mkdir -p storage_state
      - aws s3 cp s3://${ARTIFACTS_BUCKET}/storage_state/state.json storage_state/state.json
      - echo "StorageState size:" && wc -c storage_state/state.json
      - echo "=== Executando testes unitários ==="
      - python -m pytest tests/ --tb=short -q --ignore=tests/test_poc_orchestrator.py --ignore=tests/test_auth_manager.py --ignore=tests/test_prop_auth_manager.py
      - echo "=== Testes OK ==="

  build:
    commands:
      - echo "=== Iniciando Xvfb ==="
      - Xvfb :99 -screen 0 1920x1080x24 &
      - export DISPLAY=:99
      - sleep 2
      - echo "=== Config ==="
      - echo "POC_STORAGE_STATE_PATH=${POC_STORAGE_STATE_PATH}"
      - echo "POC_CHANNEL_URL=${POC_CHANNEL_URL}"
      - ls -la storage_state/state.json
      - echo "=== Executando PoC com Google Chrome + Xvfb ==="
      - mkdir -p output
      - timeout 180 python -m src || true
      - echo "=== PoC finalizada ==="

  post_build:
    commands:
      - echo "=== Relatório ==="
      - cat output/poc_report.json || echo "Relatório não gerado (timeout ou erro)"
      - echo "=== Screenshots de diagnóstico ==="
      - ls -la output/screenshot_*.png 2>/dev/null || echo "Nenhum screenshot encontrado"
      - aws s3 sync output/ s3://${ARTIFACTS_BUCKET}/output/$(date +%Y%m%d-%H%M%S)/ || true

artifacts:
  files:
    - output/**/*
  name: widevine-poc-results
  discard-paths: no
