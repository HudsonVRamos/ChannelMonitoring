version: 0.2

env:
  parameter-store:
    POC_CHANNEL_URL: "/widevine-poc/channel-url"
    POC_LOG_LEVEL: "/widevine-poc/log-level"
  variables:
    POC_OUTPUT_DIR: "./output"
    ARTIFACTS_BUCKET: "widevine-poc-artifacts-us-east-1-761018874615"

phases:
  pre_build:
    commands:
      - echo "=== Baixando storageState do S3 ==="
      - mkdir -p storage_state
      - aws s3 cp s3://${ARTIFACTS_BUCKET}/storage_state/state.json storage_state/state.json
      - echo "=== Construindo imagem Docker com Playwright + Widevine ==="
      - docker build -t widevine-poc .

  build:
    commands:
      - echo "=== Verificando Widevine CDM no container ==="
      - docker run --rm --shm-size=2g widevine-poc --help || true
      - echo "=== Executando PoC dentro do container Docker ==="
      - mkdir -p output
      - |
        docker run --rm \
          --shm-size=2g \
          -e POC_CHANNEL_URL="${POC_CHANNEL_URL}" \
          -e POC_LOG_LEVEL="${POC_LOG_LEVEL}" \
          -e POC_STORAGE_STATE_PATH="/app/storage_state/state.json" \
          -e POC_OUTPUT_DIR="/app/output" \
          -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" \
          -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" \
          -e AWS_SESSION_TOKEN="${AWS_SESSION_TOKEN}" \
          -e AWS_DEFAULT_REGION="us-east-1" \
          -v "$(pwd)/storage_state:/app/storage_state:ro" \
          -v "$(pwd)/output:/app/output" \
          widevine-poc
      - echo "=== PoC finalizada ==="

  post_build:
    commands:
      - echo "=== Relatório ==="
      - cat output/poc_report.json || echo "Relatório não encontrado"
      - aws s3 sync output/ s3://${ARTIFACTS_BUCKET}/output/$(date +%Y%m%d-%H%M%S)/ || true

artifacts:
  files:
    - output/**/*
  name: widevine-poc-results
  discard-paths: no
